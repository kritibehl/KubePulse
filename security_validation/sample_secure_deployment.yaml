apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-kubepulse
  annotations:
    kubepulse.io/tls: "enabled"
    kubepulse.io/auth: "required"
spec:
  template:
    spec:
      containers:
        - name: kubepulse
          image: kubepulse:latest
          env:
            - name: RELEASE_GATE_MODE
              value: "enabled"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
