apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: kubepulse
            - name: POSTGRES_PASSWORD
              value: kubepulse
            - name: POSTGRES_DB
              value: kubepulse
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U kubepulse -d kubepulse
            initialDelaySeconds: 3
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubepulse-demo-api
  labels:
    app: kubepulse-demo-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubepulse-demo-api
  template:
    metadata:
      labels:
        app: kubepulse-demo-api
    spec:
      containers:
        - name: api
          image: kubepulse-demo-api:local
          imagePullPolicy: Never
          env:
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kubepulse-demo-api
spec:
  selector:
    app: kubepulse-demo-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
