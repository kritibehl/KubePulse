apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: kubepulse-topology-gate
  namespace: kubepulse-topology-e2e
spec:
  metrics:
    - name: kubepulse-topology-consistency
      count: 1
      failureLimit: 0
      inconclusiveLimit: 0
      provider:
        plugin:
          kubepulse/network-regression:
            hubbleRelay: hubble-relay.kube-system.svc.cluster.local:80

            stableSelector: "k8s:kubepulse-rollout-role=stable"
            canarySelector: "k8s:kubepulse-rollout-role=canary"

            windowSeconds: 20
            queryTimeoutSeconds: 20
            maxLostEvents: 0

            thresholds:
              minFlows: 1
              minDNSQueries: 1
              minTCPAttempts: 1
              minHTTPRequests: 1
              dnsFailureDelta: 1.0
              dropRateDelta: 1.0
              tcpFailureDelta: 1.0
              http5xxDelta: 1.0

            topology:
              enabled: true
              namespace: kubepulse-topology-e2e
              expectedService: payment-v2
              sourceSelector: "k8s:topology-role=checkout-v2"
              maxLostEvents: 0
