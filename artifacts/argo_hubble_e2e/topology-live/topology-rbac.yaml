apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubepulse-topology-reader
  namespace: kubepulse-topology-e2e
rules:
  - apiGroups:
      - ""
    resources:
      - services
      - pods
    verbs:
      - get
      - list
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubepulse-topology-reader
  namespace: kubepulse-topology-e2e
subjects:
  - kind: ServiceAccount
    name: argo-rollouts
    namespace: argo-rollouts
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubepulse-topology-reader
