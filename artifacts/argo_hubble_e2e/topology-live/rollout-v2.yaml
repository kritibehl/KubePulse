apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: checkout-rollout
  namespace: kubepulse-topology-e2e
spec:
  replicas: 2
  revisionHistoryLimit: 2

  selector:
    matchLabels:
      app: checkout

  template:
    metadata:
      labels:
        app: checkout
        version: v2
        kubepulse-rollout-role: canary
        topology-role: checkout-v2
    spec:
      containers:
        - name: checkout
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              touch /tmp/ready
              while true; do
                wget -q -T 2 -O /dev/null http://payment-v1:8080/ || true
                sleep 0.2
              done
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - test -f /tmp/ready
            initialDelaySeconds: 1
            periodSeconds: 2

  strategy:
    canary:
      maxSurge: 1
      maxUnavailable: 0
      steps:
        - setWeight: 50
        - pause:
            duration: 20s
        - analysis:
            templates:
              - templateName: kubepulse-topology-gate
