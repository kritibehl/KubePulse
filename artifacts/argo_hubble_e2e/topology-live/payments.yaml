apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-v1
  namespace: kubepulse-topology-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment
      version: v1
  template:
    metadata:
      labels:
        app: payment
        version: v1
        topology-destination: payment-v1
    spec:
      containers:
        - name: payment
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              mkdir -p /www
              echo payment-v1 > /www/index.html
              exec httpd -f -p 8080 -h /www
          ports:
            - containerPort: 8080
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - wget -q -T 1 -O - http://127.0.0.1:8080/ | grep -q payment-v1
            initialDelaySeconds: 1
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: payment-v1
  namespace: kubepulse-topology-e2e
spec:
  selector:
    app: payment
    version: v1
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
