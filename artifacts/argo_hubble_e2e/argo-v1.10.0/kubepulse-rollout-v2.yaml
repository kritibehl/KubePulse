apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: kubepulse-network-rollout
  namespace: kubepulse-e2e
spec:
  replicas: 2
  revisionHistoryLimit: 2

  selector:
    matchLabels:
      app: kubepulse-rollout-client

  template:
    metadata:
      labels:
        app: kubepulse-rollout-client
        cohort: canary
        kubepulse-rollout-role: canary
      annotations:
        kubepulse.dev/release: v2
    spec:
      containers:
        - name: client
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent

          command:
            - sh
            - -c
            - |
              touch /tmp/ready
              while true; do
                wget -q -T 1 -O /dev/null http://kubepulse-backend:8080/ || true
                sleep 0.2
              done

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - test -f /tmp/ready
            initialDelaySeconds: 1
            periodSeconds: 2

          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              cpu: 100m
              memory: 32Mi

  strategy:
    canary:
      maxSurge: 1
      maxUnavailable: 0
      steps:
        - setWeight: 50
        - pause:
            duration: 30s
        - analysis:
            templates:
              - templateName: kubepulse-rollout-gate
