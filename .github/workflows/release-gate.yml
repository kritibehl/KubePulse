name: KubePulse Release Gate

on:
  pull_request:
  push:

jobs:
  release-gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate release gate artifact
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("ci_release_gate/release_gate_result.json")
          data = json.loads(path.read_text())

          required = [
              "candidate_release",
              "service",
              "safe_to_operate",
              "release_decision",
              "reason",
              "p95_latency_delta_pct",
              "error_rate_delta",
          ]

          missing = [k for k in required if k not in data]
          if missing:
              raise SystemExit(f"Missing fields: {missing}")

          print(json.dumps(data, indent=2))

          if data["release_decision"] == "block":
              print("Release gate would block this rollout.")
          PY
