name: KubePulse Release Gate

on:
  push:
  pull_request:

jobs:
  release-safety-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt pytest

      - run: pytest -q

      - name: Validate release decision artifact
        run: python3 scripts/validate_release_artifact.py
