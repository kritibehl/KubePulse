frr defaults traditional
hostname r1
log stdout
service integrated-vtysh-config
!
ip prefix-list PL-R2-LAN-IN seq 10 permit 10.20.2.0/24
ip prefix-list PL-R1-LAN-OUT seq 10 permit 10.10.1.0/24
!
router bgp 65001
 bgp router-id 1.1.1.1
 neighbor 10.12.0.2 remote-as 65002
 !
 address-family ipv4 unicast
  network 10.10.1.0/24
  neighbor 10.12.0.2 activate
  neighbor 10.12.0.2 prefix-list PL-R2-LAN-IN in
  neighbor 10.12.0.2 prefix-list PL-R1-LAN-OUT out
 exit-address-family
!
line vty
