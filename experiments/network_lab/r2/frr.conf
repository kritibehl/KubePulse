frr defaults traditional
hostname r2
log stdout
service integrated-vtysh-config
!
ip prefix-list PL-R1-LAN-IN seq 10 permit 10.10.1.0/24
ip prefix-list PL-R2-LAN-OUT seq 10 permit 10.20.2.0/24
!
router bgp 65002
 bgp router-id 2.2.2.2
 neighbor 10.12.0.1 remote-as 65001
 !
 address-family ipv4 unicast
  network 10.20.2.0/24
  neighbor 10.12.0.1 activate
  neighbor 10.12.0.1 prefix-list PL-R1-LAN-IN in
  neighbor 10.12.0.1 prefix-list PL-R2-LAN-OUT out
 exit-address-family
!
line vty
