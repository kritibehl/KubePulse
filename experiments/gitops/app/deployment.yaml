apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubepulse-gitops-demo
  namespace: kubepulse-gitops
  labels:
    app: kubepulse-gitops-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubepulse-gitops-demo
  template:
    metadata:
      labels:
        app: kubepulse-gitops-demo
    spec:
      containers:
        - name: kubepulse
          image: kubepulse-demo-api:gitops-v1
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
